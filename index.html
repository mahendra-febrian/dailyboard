<!-- Minggu 1 -->
<!-- index.html -->
<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <title>Dailyboard</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <header>
      <!-- Tugas Minggu 12 -->
      <p id="status"></p>

      <h1>Dailyboard</h1>

      <!-- Tugas Minggu 14 -->
      <button id="toggle-tema">Toggle Tema</button>
    </header>
    <main id="app">
      <form action="" id="form-cari-tugas">
        <label for="cari-tugas"><b>Cari Tugas</b></label>
        <input type="text" id="cari-tugas" placeholder="Cari Tugas..." />
      </form>

      <!-- Tugas Minggu 6 -->
      <button id="selesai">Selesai</button>
      <button id="belum">Belum</button>
      <button id="semua">Semua</button>

      <!-- Tugas Minggu 3 -->
      <form action="" id="form-tugas">
        <label for="nama-tugas"><b>Tambah Tugas</b></label>
        <input type="text" id="nama-tugas" placeholder="Nama Tugas..." />
        <button id="tambah-tugas">Tambah</button>
      </form>

      <!-- Tugas Minggu 4 -->
      <ul id="daftar-tugas"></ul>

      <!-- Tugas Minggu 8 -->
      <section id="daftar-catatan"></section>

      <form action="" id="form-catatan">
        <label for="isi-catatan"><b>Tambah Catatan</b></label>
        <textarea
          name="isi-catatan"
          id="isi-catatan"
          placeholder="Isi Catatan..."
        ></textarea>
        <button id="tambah-catatan">Tambah</button>
      </form>

      <!-- Tugas Minggu 10 -->
      <section id="kutipan-harian">
        <h2>Kutipan Harian</h2>
      </section>

      <!-- Tugas Minggu 11 -->
      <form action="" id="form-cuaca">
        <label for="nama-kota"><b>Kota</b></label>
        <input
          type="text"
          name="nama-kota"
          id="nama-kota"
          placeholder="Nama Kota..."
        />
        <button id="cari-kota">Cari</button>
      </form>

      <form action=""></form>

      <section id="info-cuaca"></section>
    </main>

    <!-- Tugas Minggu 1 -->
    <footer><p>&copy; Mahendra Febrian</p></footer>
    <script type="module" src="script.js"></script>
  </body>
</html>
